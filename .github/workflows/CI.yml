name: Terraform_CI

on:
    push:
        branches:
            - feature
    pull_request:
        branches:
            - main

permissions:
    contents: read
    pull-requests: write

defaults:
    run:
        shell: bash
      
env:
    TF_VERSION: "1.14.0"

jobs:
    # ============================================================
    # GITLEAKS - SECRET / CREDENTIAL SCAN
    # ============================================================
    gitleaks:
        name: Gitleaks Secret Scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ============================================================
    # BUILD
    # ============================================================
    build:
        name: Build
        runs-on: ubuntu-latest

        needs: gitleaks

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            # --------------------------------------------------------
            # Terraform
            # --------------------------------------------------------
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            - name: Terraform Init
              run: terraform init

            - name: Terraform Format
              run: terraform fmt -recursive -check

            - name: Terraform Validate
              run: terraform validate

    # ============================================================
    # SECURITY SCAN
    # ============================================================
    scan:
        name: Security Scan
        runs-on: ubuntu-latest

        needs: build

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            # ========================================================
            # TFLINT
            # ========================================================
            - name: Setup TFLint
              uses: terraform-linters/setup-tflint@v4

            - name: Init TFLint
              run: tflint --init

            - name: Run TFLint
              run: tflint --recursive

            # ========================================================
            # TRIVY IaC SCAN
            # ========================================================
            - name: Run Trivy IaC Scan
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: config
                  scan-ref: environment/dev
                  severity: HIGH,CRITICAL
                  exit-code: 1

    # ============================================================
    # TERRAFORM PLAN
    # ============================================================
    plan:
        name: Terraform Plan
        runs-on: ubuntu-latest

        needs: scan

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            # --------------------------------------------------------
            # Terraform
            # --------------------------------------------------------
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            # --------------------------------------------------------
            # Azure Login
            # --------------------------------------------------------
            - name: Azure Login
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.login }}

            # --------------------------------------------------------
            # Terraform Init
            # --------------------------------------------------------
            - name: Terraform Init
              run: terraform init

            # --------------------------------------------------------
            # Terraform Plan
            # --------------------------------------------------------
            - name: Terraform Plan
              run: terraform plan -out=tfplan

            # --------------------------------------------------------
            # Plan Summary
            # --------------------------------------------------------
            - name: Terraform Plan Summary
              run: |
                  terraform show -no-color tfplan | grep "^Plan:" || \
                  echo "No infrastructure changes."

            # --------------------------------------------------------
            # Upload Terraform Plan
            # --------------------------------------------------------
            - name: Upload Terraform Plan
              uses: actions/upload-artifact@v4
              with:
                  name: terraform-plan
                  path: tfplan

    # ============================================================
    # INFRACOST
    # ============================================================
    infracost:
        name: Infracost
        runs-on: ubuntu-latest

        needs: plan

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            # --------------------------------------------------------
            # Terraform
            # --------------------------------------------------------
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            # --------------------------------------------------------
            # Azure Login
            # --------------------------------------------------------
            - name: Azure Login
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.login }}

            # --------------------------------------------------------
            # Terraform Init
            # --------------------------------------------------------
            - name: Terraform Init
              run: terraform init

            # --------------------------------------------------------
            # Terraform Plan
            # --------------------------------------------------------
            - name: Terraform Plan
              run: terraform plan -out=tfplan

            # ========================================================
            # INFRACOST SETUP
            # ========================================================
            - name: Setup Infracost
              uses: infracost/actions/setup@v3
              with:
                  api-key: ${{ secrets.INFRACOST_API_KEY }}

            # ========================================================
            # INFRACOST BREAKDOWN
            # ========================================================
            - name: Generate Infracost Breakdown
              run: |
                  infracost breakdown \
                    --path tfplan \
                    --format json \
                    --out-file infracost.json

            # ========================================================
            # SHOW COST
            # ========================================================
            - name: Show Infracost
              run: |
                  infracost output \
                    --path infracost.json \
                    --format table

            # ========================================================
            # UPLOAD INFRACOST REPORT
            # ========================================================
            - name: Upload Infracost Report
              uses: actions/upload-artifact@v4
              with:
                  name: infracost-report
                  path: infracost.json

    # ============================================================
    # TEST
    # ============================================================
    test:
        name: Terraform Test
        runs-on: ubuntu-latest

        needs: infracost

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            # --------------------------------------------------------
            # Terraform
            # --------------------------------------------------------
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ env.TF_VERSION }}

            # --------------------------------------------------------
            # Terraform Init
            # --------------------------------------------------------
            - name: Terraform Init
              run: terraform init

            # --------------------------------------------------------
            # Terraform Validate
            # --------------------------------------------------------
            - name: Terraform Validate
              run: terraform validate

            # --------------------------------------------------------
            # Terraform Test
            # --------------------------------------------------------
            - name: Terraform Test
              run: terraform test
